<div id="upd" role="status" aria-live="polite"><span>✨ 새 버전이 준비되었어요</span><button id="updb">업데이트</button><button id="updc" aria-label="닫기">✕</button></div>
<script>
//CORE_START
const N=15,ON=(r,c)=>r>=0&&r<N&&c>=0&&c<N,at=(b,r,c)=>ON(r,c)?b[r*N+c]:3,D4=[[0,1],[1,0],[1,1],[1,-1]];
const COLS="ABCDEFGHIJKLMNO",cn=(r,c)=>COLS[c]+(N-r);

function span(b,r,c,dr,dc,k){
  let a=0,z=0;
  while(at(b,r-(a+1)*dr,c-(a+1)*dc)===k)a++;
  while(at(b,r+(z+1)*dr,c+(z+1)*dc)===k)z++;
  return[a,z];
}

function winCells(b,r,c,k,rule){
  for(const[dr,dc]of D4){
    const[a,z]=span(b,r,c,dr,dc,k),n=a+z+1;
    if(n===5||(n>5&&(rule!=="renju"||k===2))){
      const o=[];
      for(let i=-a;i<=z;i++)o.push([r+i*dr,c+i*dc]);
      return o;
    }
  }
  return null;
}

function wins(b,r,c,k,rule){
  if(!ON(r,c)||b[r*N+c])return null;
  b[r*N+c]=k;
  const w=winCells(b,r,c,k,rule);
  b[r*N+c]=0;
  return w;
}

function countFours(b,r,c,dr,dc){
  const k=b[r*N+c],[ca,cz]=span(b,r,c,dr,dc,k),contig=ca+cz+1;
  let cnt=0;
  for(let o=-4;o<=4;o++){
    if(!o)continue;
    const x=r+o*dr,y=c+o*dc;
    if(at(b,x,y)!==0)continue;
    b[x*N+y]=k;
    const[a,z]=span(b,x,y,dr,dc,k);
    b[x*N+y]=0;
    if(a+z+1===5&&-a<=-o&&-o<=z){
      if(contig===4)return 1;
      cnt++;
    }
  }
  return cnt;
}

function open4(b,r,c,dr,dc,rule="renju"){
  const k=b[r*N+c],[a,z]=span(b,r,c,dr,dc,k);
  if(a+z+1!==4)return false;
  const exact=rule==="renju"&&k===1;
  for(const s of[-(a+1),z+1]){
    const x=r+s*dr,y=c+s*dc;
    if(at(b,x,y)!==0)return false;
    b[x*N+y]=k;
    const[a2,z2]=span(b,x,y,dr,dc,k);
    b[x*N+y]=0;
    const n2=a2+z2+1;
    if(exact?n2!==5:n2<5)return false;
  }
  return true;
}

function isThree(b,r,c,dr,dc,d){
  const k=b[r*N+c];
  for(let o=-4;o<=4;o++){
    if(!o)continue;
    const x=r+o*dr,y=c+o*dc;
    if(at(b,x,y)!==0)continue;
    b[x*N+y]=k;
    let ok=open4(b,x,y,dr,dc,"renju");
    if(ok){const[a,z]=span(b,x,y,dr,dc,k);ok=-a<=-o&&-o<=z;}
    b[x*N+y]=0;
    if(ok&&(d>=3||forb(b,x,y,d+1)===""))return true;
  }
  return false;
}

function forb(b,r,c,d=0){
  if(!ON(r,c)||b[r*N+c]!==0)return"";
  b[r*N+c]=1;
  let five=false,over=false,f=0,t=0;
  for(const[dr,dc]of D4){
    const[a,z]=span(b,r,c,dr,dc,1),n=a+z+1;
    if(n===5)five=true;
    else if(n>5)over=true;
  }
  if(!five&&!over){
    for(const[dr,dc]of D4){
      const fc=countFours(b,r,c,dr,dc);
      if(fc>0)f+=fc;
      else if(isThree(b,r,c,dr,dc,d))t++;
    }
  }
  b[r*N+c]=0;
  return five?"":over?"6":f>1?"4":t>1?"3":"";
}

function cs(b,r,c,k,rule){
  b[r*N+c]=k;
  let s=14-Math.abs(r-7)-Math.abs(c-7),f=0,t=0;
  const exact=rule==="renju"&&k===1;
  for(const[dr,dc]of D4){
    const[a,z]=span(b,r,c,dr,dc,k),n=a+z+1;
    const la=at(b,r-(a+1)*dr,c-(a+1)*dc),rz=at(b,r+(z+1)*dr,c+(z+1)*dc);
    const e=(la===0?1:0)+(rz===0?1:0);
    if(n===5||(n>5&&!exact)){s+=1e6;continue;}
    if(n>5&&exact){continue;}
    if(n===4){
      if(e===2){s+=55000;f+=2;}
      else if(e===1){s+=6000;f++;}
      continue;
    }
    let ga=0,gz=0;
    if(la===0)while(at(b,r-(a+2+ga)*dr,c-(a+2+ga)*dc)===k)ga++;
    if(rz===0)while(at(b,r+(z+2+gz)*dr,c+(z+2+gz)*dc)===k)gz++;
    const le2=la===0&&at(b,r-(a+2+ga)*dr,c-(a+2+ga)*dc)===0;
    const re2=rz===0&&at(b,r+(z+2+gz)*dr,c+(z+2+gz)*dc)===0;
    const b4a=la===0&&ga>0&&(exact?n+ga===4:n+ga>=4);
    const b4z=rz===0&&gz>0&&(exact?n+gz===4:n+gz>=4);
    if(b4a||b4z){
      const bc=(b4a?1:0)+(b4z?1:0);
      s+=bc*5200;f+=bc;
    }else if(n===3){
      if(e===2){s+=3500;t++;}
      else if(e===1)s+=320;
    }else if((la===0&&ga>0&&n+ga===3&&le2&&rz===0)||(rz===0&&gz>0&&n+gz===3&&re2&&la===0)){
      s+=2800;t++;
    }else if(n===2){
      s+=e===2?220:e===1?25:0;
    }else{
      s+=e*5;
    }
  }
  b[r*N+c]=0;
  if(f>1||(f&&t))s+=25000;
  else if(t>1)s+=10000;
  return s;
}

function cands(b){
  const o=[];let any=false;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(b[r*N+c]){any=true;continue;}
    let ok=false;
    for(let i=-2;i<=2&&!ok;i++)for(let j=-2;j<=2;j++){
      const v=at(b,r+i,c+j);
      if(v===1||v===2){ok=true;break;}
    }
    if(ok)o.push([r,c]);
  }
  return any?o:[[7,7]];
}

function ranked(b,k,W,rule){
  let L=cands(b);
  if(rule==="renju"&&k===1)L=L.filter(([r,c])=>forb(b,r,c)==="");
  return L.map(([r,c])=>({r,c,h:cs(b,r,c,k,rule)+.92*cs(b,r,c,3-k,rule)}))
    .sort((p,q)=>q.h-p.h).slice(0,W);
}

let DL=0,TO=false,NC=0;
function nega(b,k,d,al,be,W,rule){
  if((++NC&63)===0&&Date.now()>DL)TO=true;
  if(TO)return 0;
  const L=ranked(b,k,W,rule);
  if(!L.length)return 0;
  let best=-Infinity;
  for(const m of L){
    if(m.h>=9e5&&wins(b,m.r,m.c,k,rule))return 1e7+d;
    let v;
    if(d<=1){
      v=m.h;
    }else{
      b[m.r*N+m.c]=k;
      v=m.h-nega(b,3-k,d-1,m.h-be,m.h-al,W,rule);
      b[m.r*N+m.c]=0;
      if(TO)return 0;
    }
    if(v>best)best=v;
    if(v>al)al=v;
    if(al>=be)break;
  }
  return best;
}

function legalMoves(b,k,rule){
  const bad=(r,c)=>rule==="renju"&&k===1&&forb(b,r,c)!=="",o=[];
  for(const[r,c]of cands(b))if(!bad(r,c))o.push({r,c});
  if(!o.length)for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!b[r*N+c]&&!bad(r,c))o.push({r,c});
  return o;
}

function pick(b,k,rule,maxD,ms,W){
  let L=ranked(b,k,W+12,rule);
  if(!L.length)return null;
  DL=Date.now()+ms;TO=false;NC=0;
  for(const m of L)if(m.h>=9e5&&wins(b,m.r,m.c,k,rule))return m;
  L=L.slice(0,W);
  let best=L[0];
  for(let d=1;d<=maxD;d++){
    let bm=null,bv=-Infinity;
    for(const m of L){
      b[m.r*N+m.c]=k;
      const v=m.h-(d>1?nega(b,3-k,d-1,-Infinity,m.h-bv,W,rule):0);
      b[m.r*N+m.c]=0;
      if(TO)break;
      if(v>bv){bv=v;bm=m;}
    }
    if(TO)break;
    if(bm){best=bm;L.splice(L.indexOf(bm),1);L.unshift(bm);}
  }
  return best;
}

const LV=[null,{d:1,ms:50,W:6},{d:2,ms:300,W:8},{d:4,ms:800,W:10},{d:8,ms:2500,W:12}];
function aiPick(b,k,rule,lv){
  const P=LV[lv]||LV[2];let m=null;
  try{
    if(lv===1&&Math.random()<.5){
      const L=legalMoves(b,k,rule);
      m=L[Math.random()*L.length|0];
    }else m=pick(b,k,rule,P.d,P.ms,P.W);
  }catch(e){m=null;}
  if(!m){
    try{const L=legalMoves(b,k,rule);m=L[Math.random()*L.length|0]||null;}catch(e){m=null;}
  }
  return m;
}

function rate(b,k,rule,r,c){
  DL=Date.now()+600;TO=false;NC=0;
  const L=ranked(b,k,8,rule);
  if(!L.some(m=>m.r===r&&m.c===c))L.push({r,c,h:cs(b,r,c,k,rule)+.92*cs(b,r,c,3-k,rule)});
  const vs=L.map(m=>{
    if(wins(b,m.r,m.c,k,rule))return[m,1e7];
    b[m.r*N+m.c]=k;
    const v=m.h-nega(b,3-k,2,-Infinity,Infinity,6,rule);
    b[m.r*N+m.c]=0;
    return[m,v];
  }).sort((p,q)=>q[1]-p[1]);
  if(TO||vs.length<2)return"";
  const pv=(vs.find(a=>a[0].r===r&&a[0].c===c)||[0,-1e9])[1];
  if(pv>=1e7)return"";
  const bv=vs[0][1],loss=bv-pv;
  if(loss>=50000)return"??";
  if(loss>=15000)return"?";
  if(loss>=4000)return"?!";
  if(loss<=1){const g=bv-vs[1][1];if(g>=30000)return"!!";if(g>=8000)return"!";}
  return"";
}

function threats(b,k,rule){
  const f=[],t=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(b[r*N+c])continue;
    if(wins(b,r,c,k,rule)){f.push([r,c]);continue;}
    if(rule==="renju"&&k===1&&forb(b,r,c)!=="")continue;
    b[r*N+c]=k;
    let o=false;
    for(const[dr,dc]of D4)if(open4(b,r,c,dr,dc,rule)){o=true;break;}
    b[r*N+c]=0;
    if(o)t.push([r,c]);
  }
  return{f,t};
}

function loadState(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return false;

    if(!s||s.v!==1||!Array.isArray(s.H)||s.H.length<1)return false;
    if(["b","w","2"].includes(s.mode))mode.value=s.mode;
    if(["free","renju"].includes(s.rule))rule.value=s.rule;
    if(["1","2","3","4"].includes(String(s.lvl)))lvl.value=String(s.lvl);
    if(["0:0","60:0","180:2","300:0","600:0"].includes(s.tcs))tcs.value=s.tcs;
    learn=!!s.learn;snd=s.snd!==false;conf=s.conf!==false;showNum=!!s.showNum;if(s.theme)theme=s.theme;

function tone(f,t0,d,ty,v,f2){const a=AC,o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}

function play(r,c){
  if(over||!ON(r,c))return;
  const k=turn(),rl=RL(),b=boardAt(H.length-1);
  if(b[r*N+c]||(rl==="renju"&&k===1&&forb(b,r,c)))return;
  let q="";
  if(learn&&(mode.value==="2"||k===myK())){try{q=rate(b,k,rl,r,c);}catch(e){q="";}}
  const w=wins(b,r,c,k,rl);
  if(clk)T[k]+=INC;
  H.push({r,c,k,T:{...T},q});vi=null;pv=null;hint=null;
  const nb=boardAt(H.length-1);
  if(w){over=true;wl=w;res=SN[k]+" 승리 ("+w.length+"목)";}
  else if(H.length-1>=N*N){over=true;wl=null;res="무승부 (판이 가득 찼어요)";}
  else if(rl==="renju"&&turn()===1&&legalMoves(nb,1,rl).length===0){over=true;wl=null;res="무승부 (흑이 둘 수 있는 곳이 없어요)";}
  let msg=q?QT[q]:"";
  if(learn&&!over&&(mode.value==="2"||3-k===myK())){
    try{
      const th=threats(nb,k,rl),nm=a=>a.slice(0,3).map(p=>cn(p[0],p[1])).join(", ");
      if(th.f.length)msg="⚠️ 상대가 4를 만들었어요! 꼭 막으세요 → "+nm(th.f)+(msg?" · "+msg:"");
      else if(th.t.length)msg="⚠️ 상대가 열린 3을 만들었어요! 막아야 해요 → "+nm(th.t)+(msg?" · "+msg:"");
    }catch(e){}
  }
  if(msg||!learn)tip(msg);
  saveState();
  sfx(over?"end":"move");
  fx={r,c};
  render();
  if(over)ft=setTimeout(fin,w&&!RM?1700:500);
  else next();
}

function next(){

function tap(r,c){
  if(over||busy||!humanTurn()||vi!=null||!ON(r,c))return;
  const b=boardAt(H.length-1);
  if(b[r*N+c])return;
  if(RL()==="renju"&&turn()===1){
    const f=forb(b,r,c);
    if(f){pv=null;sfx("warn");tip("🚫 흑은 여기에 둘 수 없어요 ("+FN[f]+" 금지)");return renderBoard();}
  }
  if(conf&&!(pv&&pv.r===r&&pv.c===c)){pv={r,c};hint=null;sfx("sel");return renderBoard();}
  play(r,c);
}

  const L=H.length-1,c=idx(),n=k==="f"?0:k==="p"?Math.max(0,c-1):k==="n"?c+1:L;

function cellAt(e){
  const q=bdE.getBoundingClientRect(),s=q.width/VB||1;
  const c=Math.round(((e.clientX-q.left)/s-PAD)/STEP),r=Math.round(((e.clientY-q.top)/s-PAD)/STEP);
  return ON(r,c)?[r,c]:null;
}

bdE.addEventListener("pointerdown",e=>{
  if(e.button>0||over||busy||!humanTurn()||vi!=null)return;
  dg={x:e.clientX,y:e.clientY,on:false,cell:cellAt(e),id:e.pointerId};
  try{bdE.setPointerCapture(e.pointerId);}catch(_){}
});

bdE.addEventListener("pointermove",e=>{
  if(!dg||e.pointerId!==dg.id)return;
  if(!dg.on){
    if(Math.hypot(e.clientX-dg.x,e.clientY-dg.y)<10)return;
    dg.on=true;
    const z=28*(bdE.clientWidth||VB)/VB;
    gh=document.createElement("div");gh.id="gh";
    gh.innerHTML=`<svg width="${z}" height="${z}" viewBox="-14 -14 28 28">${stone(turn(),0,0,.8)}</svg>`;
    document.body.appendChild(gh);
  }
  gh.style.left=e.clientX+"px";gh.style.top=e.clientY+"px";
  const t=cellAt(e),b=boardAt(H.length-1);
  const np=t&&!b[t[0]*N+t[1]]?{r:t[0],c:t[1]}:null;
  if((np&&np.r)!==(pv&&pv.r)||(np&&np.c)!==(pv&&pv.c)){pv=np;renderBoard();}
});

const endDrag=e=>{
  if(!dg||e.pointerId!==dg.id)return;
  const d=dg;clearDrag();
  if(e.type!=="pointerup"){pv=null;renderBoard();return;}
  const t=cellAt(e);
  if(!d.on){const c=t||d.cell;if(c)tap(c[0],c[1]);return;}
  pv=null;
  if(!t){renderBoard();return;}
  const b=boardAt(H.length-1);
  if(b[t[0]*N+t[1]]){renderBoard();return;}
  if(RL()==="renju"&&turn()===1){
    const f=forb(b,t[0],t[1]);
    if(f){sfx("warn");tip("🚫 흑은 여기에 둘 수 없어요 ("+FN[f]+" 금지)");renderBoard();return;}
  }
  play(t[0],t[1]);
};
bdE.addEventListener("pointerup",endDrag);
bdE.addEventListener("pointercancel",endDrag);

// PWA 설치 버튼 및 오프라인 업데이트 알림
let deferredPrompt=null,waitingSW=null,swReg=null,reloading=false;
const instBtn=$("inst"),updBar=$("upd");
function showUpdate(sw){waitingSW=sw;updBar.classList.add("on");}
$("updb").onclick=()=>{if(waitingSW){waitingSW.postMessage({type:"SKIP_WAITING"});updBar.classList.remove("on");}};
$("updc").onclick=()=>updBar.classList.remove("on");

window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();
  deferredPrompt=e;
  instBtn.classList.add("on");
});
instBtn.addEventListener("click",async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  instBtn.classList.remove("on");
});
window.addEventListener("appinstalled",()=>{
  deferredPrompt=null;
  instBtn.classList.remove("on");
});

if("serviceWorker"in navigator&&(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1")){
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(reloading)return;
    reloading=true;
    location.reload();
  });
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").then(reg=>{
      swReg=reg;
      if(reg.waiting&&navigator.serviceWorker.controller)showUpdate(reg.waiting);
      reg.addEventListener("updatefound",()=>{
        const nw=reg.installing;
        if(!nw)return;
        nw.addEventListener("statechange",()=>{
          if(nw.state==="installed"&&navigator.serviceWorker.controller)showUpdate(nw);
        });
      });
    }).catch(()=>{});
  });
  document.addEventListener("visibilitychange",()=>{
    if(!document.hidden&&swReg)swReg.update().catch(()=>{});
  });
}

if(!loadState())start();
</script>
